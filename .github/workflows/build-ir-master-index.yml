name: Build IR Master Index

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches:
      - feature/bulk-repository-import
    paths:
      - 'tool/build_ir_master_index.dart'
      - 'tool/ir_master_index_sources.json'
      - '.github/workflows/build-ir-master-index.yml'

permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify index tool formatting
        run: dart format --output=none --set-exit-if-changed tool/build_ir_master_index.dart

      - name: Build file-level index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dart run tool/build_ir_master_index.dart --output build/ir_master_index

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('build/ir_master_index')
          json_path = root / 'ir_master_index.json'
          csv_path = root / 'ir_master_index.csv'
          summary_path = root / 'ir_master_index_summary.md'

          data = json.loads(json_path.read_text(encoding='utf-8'))
          assert data['schema'] == 'irblaster.master-index'
          assert data['version'] == 1
          assert data['statistics']['fileCount'] > 0
          assert len(data['entries']) == data['statistics']['fileCount']
          assert data['statistics']['sourceCount'] > 0
          assert csv_path.stat().st_size > 0
          assert summary_path.stat().st_size > 0

          with csv_path.open(newline='', encoding='utf-8') as handle:
            rows = list(csv.DictReader(handle))
          assert len(rows) == data['statistics']['fileCount']

          print(json.dumps(data['statistics'], indent=2))
          PY

      - name: Upload master index artifact
        uses: actions/upload-artifact@v4
        with:
          name: ir-master-index
          path: build/ir_master_index/
          if-no-files-found: error
          retention-days: 30
